<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc CCCD bằng camera</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<style>
:root{--bg:#f6f7f4;--fg:#1c2220;--pn:#fff;--ln:#d9ddd6;--ac:#0b6e4f;--mu:#667069}
@media(prefers-color-scheme:dark){:root{--bg:#151a18;--fg:#e8ece9;--pn:#1d2321;--ln:#323b37;--ac:#4fd1a1;--mu:#9aa6a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:20px;grid-template-columns:3fr 2fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:1.5rem}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--mu)}
section{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.cam{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button,.file{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.ghost,.file{background:transparent;color:var(--fg);border:1px solid var(--ln)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#st{color:var(--mu);margin:8px 0 0;min-height:1.4em}
label{display:block;margin-top:10px;font-size:.85rem;color:var(--mu)}
input[type=text]{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
#out{width:100%;border-radius:6px;margin-bottom:6px;display:none}
.bad{border-color:#d33!important}
.list{grid-column:1/-1}
.list h2{margin:0 0 10px;font-size:1.1rem}
.list h2 span{color:var(--mu);font-weight:400}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:.85rem}
td button{padding:4px 10px;font-size:.85rem}
#empty{color:var(--mu);margin:8px 0 0}
td button.thumb{padding:0;border:1px solid var(--ln);background:none;border-radius:4px;line-height:0;cursor:zoom-in}
.thumb img{height:52px;width:auto;border-radius:3px;display:block}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;cursor:zoom-out}
#zoom[hidden]{display:none}
#zoom img{width:min(100%,900px);height:auto;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Đọc CCCD bằng camera<small>Mô hình YOLO chạy ngay trong trình duyệt, ảnh không gửi lên máy chủ</small></h1>

<section>
  <div class="cam"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
  <p id="st">Đang tải mô hình...</p>
  <div class="row">
    <button id="bStart" disabled>Bật camera</button>
    <button id="bRead" disabled>Chốt và đọc</button>
    <label class="file" style="margin:0">Tải ảnh lên<input id="up" type="file" accept="image/*" hidden></label>
    <label style="margin:0;display:flex;gap:6px;align-items:center"><input id="auto" type="checkbox" checked> Tự động đọc khi thấy thẻ</label>
    <label style="margin:0;display:flex;gap:6px;align-items:center"><input id="autoReg" type="checkbox"> Tự đăng ký khi đọc đủ</label>
  </div>
</section>

<section>
  <canvas id="out"></canvas>
  <label for="fn">Họ và tên</label><input type="text" id="fn">
  <label for="fi">Số CCCD</label><input type="text" id="fi" inputmode="numeric">
  <label for="fd">Ngày sinh (dd/mm/yyyy)</label><input type="text" id="fd">
  <div class="row"><button id="bOk">Đăng ký</button></div>
  <p id="msg"></p>
</section>

<section class="list">
  <h2>Danh sách đã đăng ký <span id="cnt">(0)</span></h2>
  <div class="tw"><table>
    <thead><tr><th>#</th><th>Ảnh thẻ</th><th>Họ và tên</th><th>Số CCCD</th><th>Ngày sinh</th><th>Đăng ký lúc</th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <p id="empty">Chưa có ai đăng ký.</p>
</section>
</main>
<div id="zoom" hidden><img id="zimg" alt="Ảnh thẻ đã quét"></div>

<script>
// Đường dẫn model: xuất bằng `yolo export ... format=onnx`, đặt trong thư mục models/ cạnh file này
const CARD_MODEL = 'models/card_best.onnx', CARD_SZ = 640;
const FIELD_MODEL = 'models/field_best.onnx', FIELD_SZ = 960;
const REC_MODEL = 'models/rec.onnx', REC_DICT = 'models/rec_dict.txt';   // PaddleOCR PP-OCRv3 rec (ONNX) + bảng ký tự
const FIELDS = ['id', 'name', 'dob'];          // thứ tự class của field_best.pt
const CW = 856, CH = 540, CARD_CONF = 0.7, MIN_FILL = 0.6, SHOW_NEED = 2, STRONG_CONF = 0.85, STRONG_FILL = 0.8, FIELD_CONF = 0.25, STABLE_NEED = 2;      // chỉ cần thẻ không bị xê dịch mạnh trong 2 lần dò liên tiếp (cho phép tay run nhẹ)

const $ = id => document.getElementById(id);
const v = $('v'), ov = $('ov'), st = t => $('st').textContent = t;
let lastCard = null, cardS, fieldS, recS, chars = [], AL = {}, armed = true, miss = 0, lastSeen = 0, tries = 0, lastOk = false,  quad = null, prev = null, pr = null, big = false, bfReady = false, bestQ = null, bestScore = 0, bestT = 0, lastSharp = 0, stable = 0, seen = 0, locked = false, busy = false, live = false, lastAuto = 0;
const fc = document.createElement('canvas');   // khung hình đầy đủ để cắt/nắn
const bf = document.createElement('canvas');   // khung nét nhất trong khoảng ngay trước khi đọc

ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;                   // không cần cross-origin isolation (chạy được trên GitHub Pages)

async function init() {
  try {
    cardS = await ort.InferenceSession.create(CARD_MODEL, { executionProviders: ['wasm'] });
    fieldS = await ort.InferenceSession.create(FIELD_MODEL, { executionProviders: ['wasm'] });
    st('Đang tải bộ nhận dạng chữ...');
    recS = await ort.InferenceSession.create(REC_MODEL, { executionProviders: ['wasm'] });
    chars = ['', ...(await (await fetch(REC_DICT)).text()).split('\n'), ' '];   // 0 = blank, cuối = dấu cách
    const idx = set => [0, ...[...chars.keys()].filter(i => i && set.includes(chars[i]))];
    AL.digit = idx('0123456789'); AL.dob = idx('0123456789/'); AL.upper = idx('ABCDEFGHIJKLMNOPQRSTUVWXYZ ');
    st('Đang khởi động mô hình...');
    try {   // chạy thử 1 lần để lần đọc đầu tiên không bị chậm
      const z = S => new ort.Tensor('float32', new Float32Array(3 * S * S), [1, 3, S, S]);
      await cardS.run({ [cardS.inputNames[0]]: z(CARD_SZ) }); await fieldS.run({ [fieldS.inputNames[0]]: z(FIELD_SZ) });
      await recS.run({ [recS.inputNames[0]]: new ort.Tensor('float32', new Float32Array(3 * 48 * 160), [1, 3, 48, 160]) });
    } catch (e) {}
    st('Sẵn sàng. Bật camera hoặc tải ảnh lên.');
    $('bStart').disabled = false;
    toggleCam();   // tự bật camera khi mở trang
  } catch (e) {
    st('Không tải được mô hình: ' + e.message + '. Mở bằng http://localhost hoặc GitHub Pages, và kiểm tra thư mục models/.');
  }
}

// ---------- tiền xử lý: letterbox về hình vuông, chuẩn hóa 0..1, kênh RGB ----------
const lbc = document.createElement('canvas');
function letterbox(src, sw, sh, S) {
  lbc.width = lbc.height = S;
  const g = lbc.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#727272'; g.fillRect(0, 0, S, S);
  const r = Math.min(S / sw, S / sh), w = Math.round(sw * r), h = Math.round(sh * r);
  const dx = (S - w) >> 1, dy = (S - h) >> 1;
  g.drawImage(src, dx, dy, w, h);
  const d = g.getImageData(0, 0, S, S).data, n = S * S, f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) { f[i] = d[4 * i] / 255; f[n + i] = d[4 * i + 1] / 255; f[2 * n + i] = d[4 * i + 2] / 255; }
  return { t: new ort.Tensor('float32', f, [1, 3, S, S]), r, dx, dy, px: d };
}

// ---------- 1. tìm thẻ bằng YOLO-seg ----------
// Mặt nạ của mô hình đôi khi lan sang tay/nền, nên không lấy 4 điểm cực của mặt nạ nữa.
// Thay vào đó khớp một hình chữ nhật xoay có tỷ lệ cạnh của thẻ (~1.586) vào các điểm mà mô hình rất chắc là "thẻ".
const MASK_TAU = 3;     // chỉ tính điểm mặt nạ có logit > 3 là chắc chắn thuộc thẻ
function rectSearcher(v, N) {   // tìm hình chữ nhật xoay có tổng điểm lớn nhất; dùng ảnh tích phân cho mỗi góc xoay
  const h2 = N / 2, R = new Float32Array(N * N), I = new Float32Array((N + 1) * (N + 1));
  const me = { best: { s: -1e9 } };
  function rotInt(th) {
    const c = Math.cos(th), sn = Math.sin(th);
    for (let y = 0; y < N; y++) {
      const ty = y - h2, bx = sn * ty + h2, by = c * ty + h2;
      for (let x = 0; x < N; x++) {
        const tx = x - h2, xs = Math.round(c * tx + bx), ys = Math.round(-sn * tx + by);
        R[y * N + x] = xs >= 0 && xs < N && ys >= 0 && ys < N ? v[ys * N + xs] : -1;
      }
    }
    for (let y = 0; y < N; y++) { let row = 0; for (let x = 0; x < N; x++) { row += R[y * N + x]; I[(y + 1) * (N + 1) + x + 1] = I[y * (N + 1) + x + 1] + row; } }
  }
  me.search = (th, aspects, ws, step, win, rad) => {
    rotInt(th);
    for (const a of aspects) for (const w of ws) {
      const wi = Math.round(w), hi = Math.round(w / a); if (wi < 6 || hi < 6 || wi >= N || hi >= N) continue;
      const xa = win ? Math.max(0, win.x - rad) : 0, xb = win ? Math.min(N - wi, win.x + rad) : N - wi;
      const ya = win ? Math.max(0, win.y - rad) : 0, yb = win ? Math.min(N - hi, win.y + rad) : N - hi;
      for (let y = ya; y <= yb; y += step) for (let x = xa; x <= xb; x += step) {
        const sc = I[(y + hi) * (N + 1) + x + wi] - I[y * (N + 1) + x + wi] - I[(y + hi) * (N + 1) + x] + I[y * (N + 1) + x];
        if (sc > me.best.s) me.best = { s: sc, th, x, y, wi, hi };
      }
    }
  };
  return me;
}
function rectFit(v, N, wmax) {
  const N2 = N >> 1, v2 = new Float32Array(N2 * N2);    // bản nửa độ phân giải để tìm thô cho nhanh
  for (let y = 0; y < N2; y++) for (let x = 0; x < N2; x++)
    v2[y * N2 + x] = (v[2 * y * N + 2 * x] + v[2 * y * N + 2 * x + 1] + v[(2 * y + 1) * N + 2 * x] + v[(2 * y + 1) * N + 2 * x + 1]) / 4;
  const S2 = rectSearcher(v2, N2), ws = [];
  for (let w = Math.max(12, wmax * 0.175); w < wmax / 2; w += Math.max(1, wmax * 0.02)) ws.push(w);
  for (let d = -90; d < 90; d += 6) S2.search(d * Math.PI / 180, [1.5, 1.586, 1.7], ws, 2, null, 0);
  const c0 = S2.best; if (c0.s < 0) return null;
  const S = rectSearcher(v, N), th0 = c0.th * 180 / Math.PI, ws2 = [];
  for (let w = c0.wi * 2 - 8; w <= c0.wi * 2 + 8; w += 2) ws2.push(w);
  for (let d = th0 - 6; d <= th0 + 6.01; d += 1.5) S.search(d * Math.PI / 180, [1.5, 1.55, 1.586, 1.65, 1.7], ws2, 1, { x: c0.x * 2, y: c0.y * 2 }, 5);
  const best = S.best, h2 = N / 2, c = Math.cos(best.th), sn = Math.sin(best.th);
  const pts = [[best.x, best.y], [best.x + best.wi, best.y], [best.x + best.wi, best.y + best.hi], [best.x, best.y + best.hi]]
    .map(([px, py]) => [c * (px - h2) - sn * (py - h2) + h2, sn * (px - h2) + c * (py - h2) + h2]);
  return { pts, fill: best.s / (best.wi * best.hi), area: best.wi * best.hi };
}
async function detectCard(src, sw, sh, loose) {   // loose=true: đang bám theo thẻ đã khoá -> ngưỡng nới để khung không chớp tắt
  const L = letterbox(src, sw, sh, CARD_SZ);
  const res = await cardS.run({ [cardS.inputNames[0]]: L.t });
  const o = res[cardS.outputNames[0]], p = res[cardS.outputNames[1]];
  const N = o.dims[2], nm = p.dims[1], ph = p.dims[2], pw = p.dims[3], d = o.data;
  let bi = -1, bs = loose ? 0.5 : CARD_CONF;
  for (let i = 0; i < N; i++) if (d[4 * N + i] > bs) { bs = d[4 * N + i]; bi = i; }
  if (bi < 0) return null;
  const cx = d[bi], cy = d[N + bi], w = d[2 * N + bi], h = d[3 * N + bi];
  const co = new Float32Array(nm); for (let k = 0; k < nm; k++) co[k] = d[(5 + k) * N + bi];
  const f = pw / CARD_SZ, pd = p.data, np_ = ph * pw, v = new Float32Array(np_).fill(-1); let pos = 0;
  const x1 = Math.max(0, Math.floor((cx - w * 0.54) * f)), x2 = Math.min(pw - 1, Math.ceil((cx + w * 0.54) * f));
  const y1 = Math.max(0, Math.floor((cy - h * 0.54) * f)), y2 = Math.min(ph - 1, Math.ceil((cy + h * 0.54) * f));
  for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
    let s = 0; for (let k = 0; k < nm; k++) s += co[k] * pd[k * np_ + y * pw + x];
    v[y * pw + x] = Math.max(-1, Math.min(1, (s - MASK_TAU) / 3)); if (s > MASK_TAU) pos++;
  }
  const r = rectFit(v, pw, Math.max(w, h) * f * 1.1);
  if (!r || r.fill < (loose ? 0.45 : MIN_FILL)) return null;           // mặt nạ không lấp đầy hình chữ nhật -> không phải thẻ
  const ratio = pos / r.area;                          // mặt nạ phải xấp xỉ bằng hình chữ nhật khớp (thẻ thật ~1.0; tay/nền lan ra thì lệch)
  if (ratio < (loose ? 0.6 : 0.75) || ratio > (loose ? 1.5 : 1.3)) return null;
  // hộp YOLO và hình chữ nhật khớp từ mặt nạ phải trùng nhau; hai thứ lệch nhau nghĩa là mặt nạ đang bám vào thứ không phải thẻ
  const axs = r.pts.map(p => p[0] / f), ays = r.pts.map(p => p[1] / f);
  const ax1 = Math.min(...axs), ax2 = Math.max(...axs), ay1 = Math.min(...ays), ay2 = Math.max(...ays);
  const iw = Math.max(0, Math.min(ax2, cx + w / 2) - Math.max(ax1, cx - w / 2)), ih = Math.max(0, Math.min(ay2, cy + h / 2) - Math.max(ay1, cy - h / 2));
  const iou = iw * ih / ((ax2 - ax1) * (ay2 - ay1) + w * h - iw * ih);
  if (iou < (loose ? 0.6 : 0.75)) return null;
  {   // độ nét của vùng thẻ (trung bình độ chênh lệch giữa điểm ảnh kề nhau); khung bị nhòe do rung tay sẽ có điểm thấp
    const xs = r.pts.map(p => p[0] / f), ys = r.pts.map(p => p[1] / f), px = L.px, W = CARD_SZ;
    const xa = Math.max(1, Math.floor(Math.min(...xs))), xb = Math.min(W - 2, Math.ceil(Math.max(...xs)));
    const ya = Math.max(1, Math.floor(Math.min(...ys))), yb = Math.min(W - 2, Math.ceil(Math.max(...ys)));
    let sum = 0, cnt = 0;
    for (let y = ya; y < yb; y += 2) for (let x = xa; x < xb; x += 2) { const i = 4 * (y * W + x) + 1; sum += Math.abs(px[i] - px[i + 4]) + Math.abs(px[i] - px[i + 4 * W]); cnt++; }
    lastSharp = cnt ? sum / cnt : 0;
  }
  const out = r.pts.map(([x, y]) => [(x / f - L.dx) / L.r, (y / f - L.dy) / L.r]);
  if (Math.hypot(out[1][0] - out[0][0], out[1][1] - out[0][1]) < 0.2 * Math.min(sw, sh)) return null;   // quá nhỏ, nhiều khả năng là nhiễu
  out.conf = bs; out.fill = r.fill; out.iou = iou;
  return out;
}

// ---------- 2. nắn phẳng (perspective transform tự viết, không cần OpenCV) ----------
function homography(s, d) {
  const A = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = s[i], [u, w] = d[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u], [0, 0, 0, x, y, 1, -w * x, -w * y, w]);
  }
  for (let i = 0; i < 8; i++) {
    let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = A[r][i] / A[i][i]; for (let c = i; c < 9; c++) A[r][c] -= f * A[i][c]; }
  }
  return A.map((r, i) => r[8] / r[i]);
}
function warp(srcCanvas, q) {
  const sw = srcCanvas.width, sh = srcCanvas.height, sd = srcCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
  const H = homography([[0, 0], [CW - 1, 0], [CW - 1, CH - 1], [0, CH - 1]], q);
  const o = document.createElement('canvas'); o.width = CW; o.height = CH;
  const g = o.getContext('2d'), im = g.createImageData(CW, CH), od = im.data;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    const z = H[6] * x + H[7] * y + 1, sx = (H[0] * x + H[1] * y + H[2]) / z, sy = (H[3] * x + H[4] * y + H[5]) / z;
    const x0 = Math.floor(sx), y0 = Math.floor(sy); if (x0 < 0 || y0 < 0 || x0 >= sw - 1 || y0 >= sh - 1) continue;
    const fx = sx - x0, fy = sy - y0, i = (y0 * sw + x0) * 4, k = (y * CW + x) * 4;
    for (let c = 0; c < 3; c++) od[k + c] = sd[i + c] * (1 - fx) * (1 - fy) + sd[i + 4 + c] * fx * (1 - fy) + sd[i + 4 * sw + c] * (1 - fx) * fy + sd[i + 4 * sw + 4 + c] * fx * fy;
    od[k + 3] = 255;
  }
  g.putImageData(im, 0, 0); return o;
}

// ---------- 3. tìm vùng id / name / dob bằng YOLO-detect, thử cả hướng 0° và 180° ----------
async function detectFields(card) {
  const L = letterbox(card, CW, CH, FIELD_SZ);
  const res = await fieldS.run({ [fieldS.inputNames[0]]: L.t });
  const o = res[fieldS.outputNames[0]], N = o.dims[2], d = o.data, best = {};
  for (let i = 0; i < N; i++) for (let c = 0; c < FIELDS.length; c++) {
    const s = d[(4 + c) * N + i];
    if (s > FIELD_CONF && (!best[FIELDS[c]] || s > best[FIELDS[c]].s)) {
      const cx = (d[i] - L.dx) / L.r, cy = (d[N + i] - L.dy) / L.r, w = d[2 * N + i] / L.r, h = d[3 * N + i] / L.r;
      best[FIELDS[c]] = { s, x: cx - w / 2, y: cy - h / 2, w, h };
    }
  }
  return best;
}
function score(b) {
  let s = Object.values(b).reduce((a, f) => a + f.s, 0);
  if (b.id && b.name && b.id.y < b.name.y) s += 0.5;
  if (b.name && b.dob && b.name.y < b.dob.y) s += 0.5;
  return s;
}
async function fixOrientation(card) {
  const r = document.createElement('canvas'); r.width = CW; r.height = CH;
  const g = r.getContext('2d'); g.translate(CW, CH); g.rotate(Math.PI); g.drawImage(card, 0, 0);

    } catch (e) { quad = null; seen = 0; locked = false; }

    ov.width = v.videoWidth; ov.height = v.videoHeight;
    const g = ov.getContext('2d'); g.clearRect(0, 0, ov.width, ov.height);
    if (quad) {
      lastSeen = Date.now();
      const ok = stable >= STABLE_NEED && big;
      g.strokeStyle = ok ? '#2ee59d' : '#ffc43d'; g.lineWidth = Math.max(3, ov.width / 300);
      g.beginPath(); quad.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.stroke();
      const rd = Math.max(5, ov.width / 180); g.fillStyle = g.strokeStyle; quad.forEach(([x, y]) => { g.beginPath(); g.arc(x, y, rd, 0, 7); g.fill(); });   // chấm 4 góc
      if (!armed && $('auto').checked) st(lastOk ? 'Đã đọc xong. Bỏ thẻ ra khỏi khung để đọc thẻ khác.' : $('st').textContent);
      else st(!big ? 'Đưa thẻ lại gần hơn.' : ok ? ($('auto').checked ? 'Đang tự đọc...' : 'Sẵn sàng đọc.') : 'Giữ thẻ trong khung...');
      if (ok && armed && $('auto').checked && Date.now() - lastAuto > 1500 && bfReady) {
        lastAuto = Date.now(); stable = 0; bfReady = false; bestScore = 0;
        readCard(bf, bestQ, true);   // đọc từ khung nét nhất cùng 4 góc của chính khung đó
      }
    } else {
      if (Date.now() - lastSeen > 1000) { armed = true; tries = 0; }   // thẻ rời khung hơn 1 giây -> sẵn sàng đọc thẻ mới
      st('Đưa CCCD vào khung hình.');
    }
  }
  setTimeout(loop, 30);
}

async function toggleCam() {
  if (live) { v.srcObject.getTracks().forEach(t => t.stop()); live = false; $('bStart').textContent = 'Bật camera'; $('bRead').disabled = true; return; }
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    await v.play(); live = true; $('bStart').textContent = 'Tắt camera'; $('bRead').disabled = false; loop();
  } catch (e) { st('Không mở được camera: ' + e.message + ' (cần HTTPS hoặc localhost và quyền camera).'); }
}
$('bStart').onclick = toggleCam;
$('bRead').onclick = () => { if (!quad) return st('Chưa thấy thẻ.'); if (bfReady) { bfReady = false; readCard(bf, bestQ); } else { grab(); readCard(fc, quad); } };
$('up').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  fc.width = img.naturalWidth; fc.height = img.naturalHeight; fc.getContext('2d').drawImage(img, 0, 0);
  st('Đang tìm thẻ trong ảnh...');
  const q = await detectCard(fc, fc.width, fc.height);
  if (!q) return st('Không thấy thẻ trong ảnh.');
  readCard(fc, q);
};
// ---------- danh sách đăng ký (lưu trong localStorage của trình duyệt, tải lại trang vẫn còn) ----------
let reg = []; try { reg = JSON.parse(localStorage.getItem('cccd_reg') || '[]'); } catch (e) {}
function saveReg() {   // trả về số ảnh phải bỏ vì đầy bộ nhớ trình duyệt (-1: không lưu nổi)
  let dropped = 0;
  for (;;) {
    try { localStorage.setItem('cccd_reg', JSON.stringify(reg)); return dropped; }
    catch (e) { const i = reg.findIndex(r => r.img); if (i < 0) return -1; reg[i].img = ''; dropped++; }   // bỏ ảnh của mục cũ nhất trước
  }
}
function snap(c) {   // thu nhỏ ảnh thẻ về 640px, nén JPEG để đỡ tốn bộ nhớ
  const W = 640, H = Math.round(c.height * W / c.width), t = document.createElement('canvas'); t.width = W; t.height = H;
  t.getContext('2d').drawImage(c, 0, 0, W, H); return t.toDataURL('image/jpeg', 0.8);
}
const zoom = (src) => { $('zimg').src = src; $('zoom').hidden = false; };
$('zoom').onclick = () => { $('zoom').hidden = true; };
addEventListener('keydown', e => { if (e.key === 'Escape') $('zoom').hidden = true; });
function renderReg() {
  const tb = $('tb'); tb.textContent = '';
  reg.forEach((r, i) => {
    const tr = tb.insertRow();
    tr.insertCell().textContent = i + 1;
    const ci = tr.insertCell();
    if (r.img) {
      const tb2 = document.createElement('button'); tb2.className = 'thumb'; tb2.title = 'Bấm để xem lớn'; tb2.setAttribute('aria-label', 'Xem ảnh thẻ của ' + r.name);
      const im = document.createElement('img'); im.src = r.img; im.alt = ''; tb2.appendChild(im); tb2.onclick = () => zoom(r.img); ci.appendChild(tb2);
    } else ci.textContent = '—';
    [r.name, r.id, r.dob, r.t].forEach(x => { tr.insertCell().textContent = x; });
    const b = document.createElement('button'); b.className = 'ghost'; b.textContent = 'Xóa';
    b.onclick = () => { reg.splice(i, 1); saveReg(); renderReg(); };
    tr.insertCell().appendChild(b);
  });
  $('cnt').textContent = '(' + reg.length + ')'; $('empty').style.display = reg.length ? 'none' : '';
}
function resetForm() {   // xóa thông tin phía trên để đón thẻ tiếp theo
  ['fn', 'fi', 'fd'].forEach(k => { $(k).value = ''; $(k).classList.remove('bad'); });
  $('out').style.display = 'none'; lastCard = null;
}
$('bOk').onclick = () => {
  const name = $('fn').value.trim().replace(/\s+/g, ' '), id = $('fi').value.trim(), dob = $('fd').value.trim();
  const okId = /^\d{12}$/.test(id), okDob = validDob(dob);
  $('fn').classList.toggle('bad', !name); $('fi').classList.toggle('bad', !okId); $('fd').classList.toggle('bad', !okDob);
  const w = [!name && 'Chưa có họ tên', !okId && 'Số CCCD cần đủ 12 chữ số', !okDob && 'Ngày sinh cần đúng dạng dd/mm/yyyy'].filter(Boolean);
  if (w.length) { $('msg').textContent = w.join('. ') + '.'; return; }
  const dup = reg.find(r => r.id === id);
  if (dup) $('msg').textContent = 'Số CCCD ' + id + ' đã đăng ký trước đó (' + dup.name + '), không thêm lại.';
  else {
    reg.push({ name, id, dob, t: new Date().toLocaleString('vi-VN'), img: lastCard ? snap(lastCard) : '' });
    const d = saveReg(); renderReg();
    $('msg').textContent = 'Đã đăng ký: ' + name + ' | ' + id + ' | ' + dob
      + (d > 0 ? '. Bộ nhớ trình duyệt đầy nên đã bỏ ảnh của ' + d + ' mục cũ nhất.' : d < 0 ? '. Không lưu được vào bộ nhớ trình duyệt, tải lại trang sẽ mất danh sách.' : '');
  }
  resetForm();
  armed = false; tries = 0; lastOk = true;     // đợi thẻ này rời khung rồi mới đọc thẻ tiếp, tránh đọc lại chính nó
  st('Bỏ thẻ ra khỏi khung, rồi đưa thẻ tiếp theo vào.');
};
renderReg();

init();
</script>
