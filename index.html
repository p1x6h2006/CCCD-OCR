<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc CCCD bằng camera</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<style>
:root{--bg:#f6f7f4;--fg:#1c2220;--pn:#fff;--ln:#d9ddd6;--ac:#0b6e4f;--mu:#667069}
@media(prefers-color-scheme:dark){:root{--bg:#151a18;--fg:#e8ece9;--pn:#1d2321;--ln:#323b37;--ac:#4fd1a1;--mu:#9aa6a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:20px;grid-template-columns:3fr 2fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:1.5rem}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--mu)}
section{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
.cam{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button,.file{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.ghost,.file{background:transparent;color:var(--fg);border:1px solid var(--ln)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#st{color:var(--mu);margin:8px 0 0;min-height:1.4em}
label{display:block;margin-top:10px;font-size:.85rem;color:var(--mu)}
input[type=text]{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
#out{width:100%;border-radius:6px;margin-bottom:6px;display:none}
.bad{border-color:#d33!important}
</style>
</head>
<body>
<main>
<h1>Đọc CCCD bằng camera<small>Mô hình YOLO chạy ngay trong trình duyệt, ảnh không gửi lên máy chủ</small></h1>

<section>
  <div class="cam"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
  <p id="st">Đang tải mô hình...</p>
  <div class="row">
    <button id="bStart" disabled>Bật camera</button>
    <button id="bRead" disabled>Chốt và đọc</button>
    <label class="file" style="margin:0">Tải ảnh lên<input id="up" type="file" accept="image/*" hidden></label>
    <label style="margin:0;display:flex;gap:6px;align-items:center"><input id="auto" type="checkbox"> Tự đọc khi thẻ đứng yên</label>
  </div>
</section>

<section>
  <canvas id="out"></canvas>
  <label for="fn">Họ và tên</label><input type="text" id="fn">
  <label for="fi">Số CCCD</label><input type="text" id="fi" inputmode="numeric">
  <label for="fd">Ngày sinh (dd/mm/yyyy)</label><input type="text" id="fd">
  <div class="row"><button id="bOk">Đăng ký</button></div>
  <p id="msg"></p>
</section>
</main>

<script>
// Đường dẫn model: xuất bằng `yolo export ... format=onnx`, đặt trong thư mục models/ cạnh file này
const CARD_MODEL = 'models/card_best.onnx', CARD_SZ = 640;
const FIELD_MODEL = 'models/field_best.onnx', FIELD_SZ = 960;
const REC_MODEL = 'models/rec.onnx', REC_DICT = 'models/rec_dict.txt';   // PaddleOCR PP-OCRv3 rec (ONNX) + bảng ký tự
const FIELDS = ['id', 'name', 'dob'];          // thứ tự class của field_best.pt
const CW = 856, CH = 540, CARD_CONF = 0.5, FIELD_CONF = 0.25, STABLE_NEED = 6;

const $ = id => document.getElementById(id);
const v = $('v'), ov = $('ov'), st = t => $('st').textContent = t;
let cardS, fieldS, recS, chars = [], AL = {},  quad = null, prev = null, stable = 0, busy = false, live = false, lastAuto = 0;
const fc = document.createElement('canvas');   // khung hình đầy đủ để cắt/nắn

ort.env.wasm.numThreads = 1;                   // không cần cross-origin isolation (chạy được trên GitHub Pages)

async function init() {
  try {
    cardS = await ort.InferenceSession.create(CARD_MODEL, { executionProviders: ['wasm'] });
    fieldS = await ort.InferenceSession.create(FIELD_MODEL, { executionProviders: ['wasm'] });
    st('Đang tải bộ nhận dạng chữ...');
    recS = await ort.InferenceSession.create(REC_MODEL, { executionProviders: ['wasm'] });
    chars = ['', ...(await (await fetch(REC_DICT)).text()).split('\n'), ' '];   // 0 = blank, cuối = dấu cách
    const idx = set => [0, ...[...chars.keys()].filter(i => i && set.includes(chars[i]))];
    AL.digit = idx('0123456789'); AL.dob = idx('0123456789/'); AL.upper = idx('ABCDEFGHIJKLMNOPQRSTUVWXYZ ');
    st('Sẵn sàng. Bật camera hoặc tải ảnh lên.');
    $('bStart').disabled = false;
  } catch (e) {
    st('Không tải được mô hình: ' + e.message + '. Mở bằng http://localhost hoặc GitHub Pages, và kiểm tra thư mục models/.');
  }
}

// ---------- tiền xử lý: letterbox về hình vuông, chuẩn hóa 0..1, kênh RGB ----------
const lbc = document.createElement('canvas');
function letterbox(src, sw, sh, S) {
  lbc.width = lbc.height = S;
  const g = lbc.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#727272'; g.fillRect(0, 0, S, S);
  const r = Math.min(S / sw, S / sh), w = Math.round(sw * r), h = Math.round(sh * r);
  const dx = (S - w) >> 1, dy = (S - h) >> 1;
  g.drawImage(src, dx, dy, w, h);
  const d = g.getImageData(0, 0, S, S).data, n = S * S, f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) { f[i] = d[4 * i] / 255; f[n + i] = d[4 * i + 1] / 255; f[2 * n + i] = d[4 * i + 2] / 255; }
  return { t: new ort.Tensor('float32', f, [1, 3, S, S]), r, dx, dy };
}

// ---------- 1. tìm thẻ bằng YOLO-seg: lấy mặt nạ rồi tìm 4 góc ----------
async function detectCard(src, sw, sh) {
  const L = letterbox(src, sw, sh, CARD_SZ);
  const res = await cardS.run({ [cardS.inputNames[0]]: L.t });
  const o = res[cardS.outputNames[0]], p = res[cardS.outputNames[1]];
  const N = o.dims[2], nm = p.dims[1], ph = p.dims[2], pw = p.dims[3], d = o.data;
  let bi = -1, bs = CARD_CONF;
  for (let i = 0; i < N; i++) if (d[4 * N + i] > bs) { bs = d[4 * N + i]; bi = i; }
  if (bi < 0) return null;
  const cx = d[bi], cy = d[N + bi], w = d[2 * N + bi], h = d[3 * N + bi];
  const co = new Float32Array(nm); for (let k = 0; k < nm; k++) co[k] = d[(5 + k) * N + bi];
  const sc = pw / CARD_SZ, pd = p.data;
  const x1 = Math.max(0, Math.floor((cx - w / 2) * sc)), x2 = Math.min(pw - 1, Math.ceil((cx + w / 2) * sc));
  const y1 = Math.max(0, Math.floor((cy - h / 2) * sc)), y2 = Math.min(ph - 1, Math.ceil((cy + h / 2) * sc));
  let tl, tr, br, bl, mTL = 1e9, mBR = -1e9, mTR = -1e9, mBL = 1e9;
  for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
    let s = 0; for (let k = 0; k < nm; k++) s += co[k] * pd[k * ph * pw + y * pw + x];
    if (s <= 0) continue;
    const a = x + y, b = x - y;
    if (a < mTL) { mTL = a; tl = [x, y]; } if (a > mBR) { mBR = a; br = [x, y]; }
    if (b > mTR) { mTR = b; tr = [x, y]; } if (b < mBL) { mBL = b; bl = [x, y]; }
  }
  if (!tl) return null;
  const toSrc = ([x, y]) => [((x + 0.5) / sc - L.dx) / L.r, ((y + 0.5) / sc - L.dy) / L.r];
  let q = [tl, tr, br, bl].map(toSrc);
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  if (dist(q[0], q[3]) > dist(q[0], q[1])) q = [q[1], q[2], q[3], q[0]];   // thẻ dọc -> xoay thứ tự góc
  return q;
}

// ---------- 2. nắn phẳng (perspective transform tự viết, không cần OpenCV) ----------
function homography(s, d) {
  const A = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = s[i], [u, w] = d[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u], [0, 0, 0, x, y, 1, -w * x, -w * y, w]);
  }
  for (let i = 0; i < 8; i++) {
    let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = A[r][i] / A[i][i]; for (let c = i; c < 9; c++) A[r][c] -= f * A[i][c]; }
  }
  return A.map((r, i) => r[8] / r[i]);
}
function warp(srcCanvas, q) {
  const sw = srcCanvas.width, sh = srcCanvas.height, sd = srcCanvas.getContext('2d').getImageData(0, 0, sw, sh).data;
  const H = homography([[0, 0], [CW - 1, 0], [CW - 1, CH - 1], [0, CH - 1]], q);
  const o = document.createElement('canvas'); o.width = CW; o.height = CH;
  const g = o.getContext('2d'), im = g.createImageData(CW, CH), od = im.data;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    const z = H[6] * x + H[7] * y + 1, sx = (H[0] * x + H[1] * y + H[2]) / z, sy = (H[3] * x + H[4] * y + H[5]) / z;
    const x0 = Math.floor(sx), y0 = Math.floor(sy); if (x0 < 0 || y0 < 0 || x0 >= sw - 1 || y0 >= sh - 1) continue;
    const fx = sx - x0, fy = sy - y0, i = (y0 * sw + x0) * 4, k = (y * CW + x) * 4;
    for (let c = 0; c < 3; c++) od[k + c] = sd[i + c] * (1 - fx) * (1 - fy) + sd[i + 4 + c] * fx * (1 - fy) + sd[i + 4 * sw + c] * (1 - fx) * fy + sd[i + 4 * sw + 4 + c] * fx * fy;
    od[k + 3] = 255;
  }
  g.putImageData(im, 0, 0); return o;
}

// ---------- 3. tìm vùng id / name / dob bằng YOLO-detect, thử cả hướng 0° và 180° ----------
async function detectFields(card) {
  const L = letterbox(card, CW, CH, FIELD_SZ);
  const res = await fieldS.run({ [fieldS.inputNames[0]]: L.t });
  const o = res[fieldS.outputNames[0]], N = o.dims[2], d = o.data, best = {};
  for (let i = 0; i < N; i++) for (let c = 0; c < FIELDS.length; c++) {
    const s = d[(4 + c) * N + i];
    if (s > FIELD_CONF && (!best[FIELDS[c]] || s > best[FIELDS[c]].s)) {
      const cx = (d[i] - L.dx) / L.r, cy = (d[N + i] - L.dy) / L.r, w = d[2 * N + i] / L.r, h = d[3 * N + i] / L.r;
      best[FIELDS[c]] = { s, x: cx - w / 2, y: cy - h / 2, w, h };
    }
  }
  return best;
}
function score(b) {
  let s = Object.values(b).reduce((a, f) => a + f.s, 0);
  if (b.id && b.name && b.id.y < b.name.y) s += 0.5;
  if (b.name && b.dob && b.name.y < b.dob.y) s += 0.5;
  return s;
}
async function fixOrientation(card) {
  const r = document.createElement('canvas'); r.width = CW; r.height = CH;
  const g = r.getContext('2d'); g.translate(CW, CH); g.rotate(Math.PI); g.drawImage(card, 0, 0);
  const [a, b] = [await detectFields(card), await detectFields(r)];
  return score(b) > score(a) ? [r, b] : [card, a];
}

// ---------- 4. OCR từng vùng bằng PaddleOCR (ONNX) ----------
// Cách đọc: nới rộng khung YOLO (khung thường cắt sát, mất chữ ở hai đầu) -> phóng to -> kéo giãn tương phản
// -> đọc 2 phiên bản (xám và màu gốc), số/ngày sinh chỉ cho phép chữ số -> chọn kết quả hợp lệ nhất (đủ 12 số, ngày hợp lệ, số khớp ngày sinh).
const SNAP_NAMES = true;   // true: sửa họ tên theo từ điển họ/đệm/tên phổ biến (đặt false để tắt)
const SURNAMES = new Set(`NGUYỄN TRẦN LÊ PHẠM HOÀNG HUỲNH PHAN VŨ VÕ ĐẶNG BÙI ĐỖ HỒ NGÔ DƯƠNG LÝ ĐINH TRƯƠNG LƯƠNG MAI LÂM ĐOÀN TRỊNH CAO TẠ HÀ VƯƠNG TÔ QUÁCH LẠI DIỆP TỪ ÂU LƯU LA ĐÀO ĐÀM KIỀU KHÚC LÃ PHÙNG THÁI TÀO`.split(/\s+/));
const NAME_WORDS = new Set([...SURNAMES, ...`VĂN THỊ MINH QUỐC HỮU ĐỨC XUÂN ANH CÔNG THÀNH GIA NGỌC THANH THÙY PHƯƠNG HỒNG KIM BẢO DIỆU THU KHÁNH TRỌNG ĐÌNH QUANG TIẾN HOÀI TRUNG NHƯ YẾN TUẤN HẢI TRÍ VIỆT MỸ THẾ NHẬT PHÚC BÁ DUY TẤN TÚ HUYỀN THIÊN ĐĂNG NGUYÊN QUỲNH PHÚ SỸ
AN BÌNH CƯỜNG DŨNG HIẾU HÙNG NAM SƠN KHOA LONG ĐẠT HUY THẮNG LAN LINH THẢO TRANG VY NGÂN HƯƠNG NHI CHI OANH TRÂM QUYÊN UYÊN LOAN HẠNH HOA HUỆ NGHĨA TÍN LỘC TÀI TÂM TOÀN TRỰC VINH PHONG PHƯỚC THỊNH THUẬN THIỆN KIỆT KHÔI HẬU GIANG DUNG DUYÊN ĐAN ĐIỀN ĐÔNG NHÂN NHÃ NHUNG LIÊN LỆ KHANG HƯNG HOÀN HÂN HẰNG HÒA HIỀN HIỆP LUÂN LỢI MẠNH NGHIÊM NGUYỆT PHÁT PHI QUÂN QUYỀN SANG SƯƠNG TÂN TRIỀU TÙNG TƯỜNG VÂN VĨ ÂN`.split(/\s+/)]);

function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
const noAccent = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/Đ/g, 'D');
function snapToken(t, pos = 1) {   // 1) khớp khi bỏ dấu (OCR hay làm rơi dấu)  2) sai đúng 1 ký tự và chỉ có 1 ứng viên
  if (NAME_WORDS.has(t) || t.length < 3) return t;
  const base = noAccent(t); let same = [...NAME_WORDS].filter(w => w.length >= 3 && noAccent(w) === base);
  if (same.length > 1) {   // mơ hồ (vd NGUYEN = NGUYỄN hoặc NGUYÊN): từ đầu tiên ưu tiên là họ, các từ sau ưu tiên không phải họ
    const pick = same.filter(w => pos === 0 ? SURNAMES.has(w) : !SURNAMES.has(w));
    if (pick.length) same = pick;
  }
  if (same.length) return same.length === 1 ? same[0] : t;
  let best = null, cnt = 0;
  for (const w of NAME_WORDS) if (w.length >= 3 && Math.abs(w.length - t.length) <= 1 && lev(t, w) === 1) { best = w; cnt++; }
  return cnt === 1 ? best : t;
}
function otsu(g) {
  const h = new Array(256).fill(0); for (const v of g) h[v]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * h[i];
  let sB = 0, wB = 0, mx = 0, t = 127; const tot = g.length;
  for (let i = 0; i < 256; i++) {
    wB += h[i]; if (!wB) continue; const wF = tot - wB; if (!wF) break;
    sB += i * h[i]; const mB = sB / wB, mF = (sum - sB) / wF, vr = wB * wF * (mB - mF) ** 2;
    if (vr > mx) { mx = vr; t = i; }
  }
  return t;
}
// Khung YOLO thường cắt cụt đuôi chữ (vd mất "ANH") nhưng nới theo chiều dọc sẽ kéo cả dòng nhãn nhỏ phía trên vào -> OCR đọc sai.
// Vì vậy nới nhiều theo chiều ngang (nhất là bên phải) và gần như không nới theo chiều dọc; thử 2 kiểu cắt.
const PADS = [{ l: .08, r: .25, y: 0 }, { l: .12, r: .12, y: 2 }];
function padBox(f, v) {
  const pl = f.w * v.l + 4, pr = f.w * v.r + 8, x = Math.max(0, f.x - pl), y = Math.max(0, f.y - v.y);
  return { x, y, w: Math.min(CW - x, f.w + pl + pr), h: Math.min(CH - y, f.h + 2 * v.y) };
}
function prep(card, f, bin, v) {
  const p = padBox(f, v), x = Math.floor(p.x), y = Math.floor(p.y), w = Math.ceil(p.w), h = Math.ceil(p.h);
  const k = Math.min(4, Math.max(1.5, 110 / h)), B = 14, cw = Math.round(w * k), ch = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = cw + 2 * B; c.height = ch + 2 * B;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.imageSmoothingQuality = 'high';
  g.drawImage(card, x, y, w, h, B, B, cw, ch);
  if (bin === 3) return c;   // giữ nguyên màu
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data, n = c.width * c.height, gray = new Uint8Array(n);
  for (let i = 0; i < n; i++) gray[i] = (0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]) | 0;
  const hist = new Uint32Array(256); for (let i = 0; i < n; i++) hist[gray[i]]++;
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * 0.02) lo++;
  acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.02) hi--;
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < n; i++) gray[i] = Math.max(0, Math.min(255, ((gray[i] - lo) * 255 / span) | 0));
  let out = gray;
  if (bin === 1) {            // ngưỡng cục bộ (chịu được loá sáng / nền không đều): so từng điểm với trung bình vùng quanh nó
    const W = c.width, Hh = c.height, I = new Float64Array((W + 1) * (Hh + 1));
    for (let y = 0; y < Hh; y++) { let r = 0; for (let x = 0; x < W; x++) { r += gray[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + r; } }
    const R = Math.max(12, Math.round(ch / 2)); out = new Uint8Array(n);
    for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
      const x0 = Math.max(0, x - R), x1 = Math.min(W, x + R + 1), y0 = Math.max(0, y - R), y1 = Math.min(Hh, y + R + 1);
      const m = (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
      out[y * W + x] = gray[y * W + x] < m * 0.88 ? 0 : 255;
    }
  } else if (bin === 2) { const t = otsu(gray); out = gray.map(v => v > t ? 255 : 0); }
  for (let i = 0; i < n; i++) { d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = out[i]; d[4 * i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
}

function recTensor(c) {   // canvas -> tensor [1,3,48,W], BGR, chuẩn hóa -1..1 (đúng kiểu PaddleOCR)
  const h = 48, w = Math.min(640, Math.max(16, Math.ceil(48 * c.width / c.height)));
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d', { willReadFrequently: true }); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, n = w * h, f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) { f[i] = (d[4 * i + 2] / 255 - .5) / .5; f[n + i] = (d[4 * i + 1] / 255 - .5) / .5; f[2 * n + i] = (d[4 * i] / 255 - .5) / .5; }
  return new ort.Tensor('float32', f, [1, 3, h, w]);
}
function ctcDecode(data, T, C, allow) {   // allow: danh sách lớp được phép (gồm blank=0); null = tất cả
  let s = '', last = -1, sum = 0, k = 0;
  for (let t = 0; t < T; t++) {
    const b = t * C; let bi = 0, bv = -1;
    if (allow) { for (const i of allow) if (data[b + i] > bv) { bv = data[b + i]; bi = i; } }
    else for (let i = 0; i < C; i++) if (data[b + i] > bv) { bv = data[b + i]; bi = i; }
    if (bi !== 0 && bi !== last) { s += chars[bi]; sum += bv; k++; }
    last = bi;
  }
  return { text: s, conf: k ? sum / k : 0 };
}
async function recognize(canvas, allow) {
  const o = (await recS.run({ [recS.inputNames[0]]: recTensor(canvas) }))[recS.outputNames[0]];
  return ctcDecode(o.data, o.dims[1], o.dims[2], allow);
}
const validDob = s => {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); if (!m) return false;
  const dd = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, dd);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === dd && y >= 1900 && y <= new Date().getFullYear();
};
// Cấu trúc CCCD: 3 số mã tỉnh (001-096), 1 số giới tính/thế kỷ (0-3), 2 số cuối năm sinh, 6 số ngẫu nhiên
const consistent = (id, dob) => id.length === 12 && validDob(dob) && id.slice(4, 6) === dob.slice(-2) && ((+dob.slice(-4) >= 2000) ? '23' : '01').includes(id[3]);
const idScore = s => (s.length === 12 ? 100 : 50 - 12 * Math.abs(s.length - 12))
  + (s.length >= 3 && +s.slice(0, 3) >= 1 && +s.slice(0, 3) <= 96 ? 10 : 0) + (s.length >= 4 && '0123'.includes(s[3]) ? 5 : 0);
const dobScore = s => validDob(s) ? 60 : (/^\d{2}\/\d{2}\/\d{4}$/.test(s) ? 20 : 0);
const NOACC = new Set([...NAME_WORDS].map(noAccent));
const nameScore = n => { const t = n.split(' ').filter(Boolean); return t.reduce((s, w) => s + (NAME_WORDS.has(w) ? 3 : NOACC.has(noAccent(w)) ? 2.5 : w.length >= 2 ? 0.5 : -2), 0) - (t.length < 2 || t.length > 6 ? 3 : 0); };

function voteId(list) {   // bỏ phiếu từng vị trí giữa các kết quả đủ 12 số
  const L = list.filter(x => x.length === 12); if (L.length < 2) return null;
  return [...Array(12).keys()].map(i => { const c = {}; L.forEach(x => c[x[i]] = (c[x[i]] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; }).join('');
}
function segment(t) {   // tên bị dính liền (PHAMXUANHIEU) -> tách bằng từ điển
  const b = noAccent(t), n = b.length, best = Array(n + 1).fill(null); best[0] = { s: 0, p: [] };
  for (let i = 0; i < n; i++) if (best[i]) for (let j = i + 2; j <= Math.min(n, i + 8); j++) {
    const w = b.slice(i, j); if (!NOACC.has(w)) continue;
    const sc = best[i].s + (j - i) ** 2; if (!best[j] || sc > best[j].s) best[j] = { s: sc, p: [...best[i].p, w] };
  }
  return best[n] ? best[n].p.join(' ') : t;
}
const idCands = t => { const d = t.replace(/\D/g, ''); if (d.length <= 12) return [d]; const o = []; for (let i = 0; i + 12 <= d.length; i++) o.push(d.slice(i, i + 12)); return o; };
const parseDob = t => { const m = t.match(/(\d{2})\s*[\/\-.]\s*(\d{2})\s*[\/\-.]\s*(\d{4})/); if (m) return m.slice(1).join('/'); const d = t.replace(/\D/g, ''); return d.length >= 8 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4, 8)}` : t.trim(); };
const cleanName = t => t.normalize('NFC').replace(/[^A-Za-zÀ-ỹĐđ\s]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();

function choose(c) {      // chọn tổ hợp (số, ngày sinh) hợp lệ và khớp nhau nhất; chọn họ tên có nhiều từ đúng nhất
  const vi = voteId(c.id); if (vi) c.id = [vi, ...c.id];
  let best = { id: '', dob: '', s: -1e9 };
  for (const i of (c.id.length ? c.id : [''])) for (const d of (c.dob.length ? c.dob : [''])) {
    const s = idScore(i) + dobScore(d) + (consistent(i, d) ? 60 : 0);
    if (s > best.s) best = { id: i, dob: d, s };
  }
  let name = '', bs = -1e9;
  for (const raw of c.name) {
    const n = raw.split(' ').map(w => SNAP_NAMES && w.length >= 6 ? segment(w) : w).join(' ');   // vd DUCANH -> DUC ANH
    const s = nameScore(n); if (s > bs) { bs = s; name = n; }
  }
  if (SNAP_NAMES) name = name.split(' ').map((w, i) => snapToken(w, i)).join(' ');
  return { id: best.id, dob: best.dob, name };
}

async function readCard(frame, q) {
  busy = true; $('bRead').disabled = true;
  try {
    st('Đang nắn phẳng thẻ...');
    const [card, boxes] = await fixOrientation(warp(frame, q));
    const out = $('out'); out.width = CW; out.height = CH; out.style.display = 'block';
    const g = out.getContext('2d'); g.drawImage(card, 0, 0); g.lineWidth = 3;
    const col = { id: '#e53935', name: '#2e7d32', dob: '#1e63d6' }, cand = { id: [], name: [], dob: [] };
    for (const k of FIELDS) {
      const f = boxes[k]; if (!f) continue;
      g.strokeStyle = col[k]; g.strokeRect(f.x, f.y, f.w, f.h);
      st('Đang đọc: ' + k + '...');
      for (const v of PADS) for (const bin of [0, 3]) {
        const c = prep(card, f, bin, v);
        if (k === 'name') {
          cand.name.push(cleanName((await recognize(c, null)).text), cleanName((await recognize(c, AL.upper)).text));
        } else if (k === 'id') cand.id.push(...idCands((await recognize(c, AL.digit)).text));
        else cand.dob.push(parseDob((await recognize(c, AL.dob)).text));
      }
    }
    const val = choose(cand);
    $('fn').value = val.name; $('fi').value = val.id; $('fd').value = val.dob;
    const w = [];
    if (val.id.length !== 12) w.push('số CCCD chưa đủ 12 chữ số');
    if (!validDob(val.dob)) w.push('ngày sinh chưa hợp lệ');
    if (val.id.length === 12 && validDob(val.dob) && !consistent(val.id, val.dob)) w.push('số CCCD không khớp ngày sinh');
    $('fi').classList.toggle('bad', val.id.length !== 12); $('fd').classList.toggle('bad', !validDob(val.dob));
    const miss = FIELDS.filter(k => !boxes[k]);
    st(miss.length ? 'Không thấy vùng: ' + miss.join(', ') + '. Hãy nhập tay hoặc chụp lại.'
      : w.length ? 'Đã đọc nhưng cần kiểm tra: ' + w.join('; ') + '.' : 'Xong. Kiểm tra và sửa nếu cần.');
  } catch (e) { st('Lỗi: ' + e.message); }
  busy = false; $('bRead').disabled = !live;
}

// ---------- vòng lặp camera: phát hiện thẻ ~6 lần/giây, vẽ khung, theo dõi độ ổn định ----------
function grab() { fc.width = v.videoWidth; fc.height = v.videoHeight; fc.getContext('2d').drawImage(v, 0, 0); }
async function loop() {
  if (!live) return;
  if (!busy && v.readyState >= 2) {
    busy = true;
    try {
      quad = await detectCard(v, v.videoWidth, v.videoHeight);
      const diag = Math.hypot(v.videoWidth, v.videoHeight);
      stable = quad && prev ? (quad.reduce((s, p, i) => s + Math.hypot(p[0] - prev[i][0], p[1] - prev[i][1]), 0) / 4 / diag < 0.01 ? stable + 1 : 0) : 0;
      prev = quad;
    } catch (e) { quad = null; }
    busy = false;
    ov.width = v.videoWidth; ov.height = v.videoHeight;
    const g = ov.getContext('2d'); g.clearRect(0, 0, ov.width, ov.height);
    if (quad) {
      const ok = stable >= STABLE_NEED;
      g.strokeStyle = ok ? '#2ee59d' : '#ffc43d'; g.lineWidth = Math.max(3, ov.width / 300);
      g.beginPath(); quad.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.stroke();
      st(ok ? 'Thẻ đã ổn định, sẵn sàng đọc.' : 'Giữ thẻ đứng yên...');
      if (ok && $('auto').checked && Date.now() - lastAuto > 6000) { lastAuto = Date.now(); stable = 0; grab(); readCard(fc, quad); }
    } else st('Đưa CCCD vào khung hình.');
  }
  setTimeout(loop, 120);
}

$('bStart').onclick = async () => {
  if (live) { v.srcObject.getTracks().forEach(t => t.stop()); live = false; $('bStart').textContent = 'Bật camera'; $('bRead').disabled = true; return; }
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    await v.play(); live = true; $('bStart').textContent = 'Tắt camera'; $('bRead').disabled = false; loop();
  } catch (e) { st('Không mở được camera: ' + e.message + ' (cần HTTPS hoặc localhost và quyền camera).'); }
};
$('bRead').onclick = () => { if (!quad) return st('Chưa thấy thẻ.'); grab(); readCard(fc, quad); };
$('up').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  fc.width = img.naturalWidth; fc.height = img.naturalHeight; fc.getContext('2d').drawImage(img, 0, 0);
  st('Đang tìm thẻ trong ảnh...');
  const q = await detectCard(fc, fc.width, fc.height);
  if (!q) return st('Không thấy thẻ trong ảnh.');
  readCard(fc, q);
};
$('bOk').onclick = () => {
  const okId = /^\d{12}$/.test($('fi').value.trim()), okDob = validDob($('fd').value.trim());
  $('fi').classList.toggle('bad', !okId); $('fd').classList.toggle('bad', !okDob);
  const w = [!okId && 'Số CCCD cần đủ 12 chữ số', !okDob && 'Ngày sinh cần đúng dạng dd/mm/yyyy'].filter(Boolean);
  $('msg').textContent = (w.length ? w.join('. ') + '. Đã ghi nhận: ' : 'Đã ghi nhận: ') + [$('fn').value, $('fi').value, $('fd').value].join(' | ');
};
init();
</script>
